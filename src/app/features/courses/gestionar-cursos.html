<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/src/assets/images/1.png">
  <title>Gestionar cursos | Taudux</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/app/shared/floating-menu/floating-menu.css">
  <link rel="stylesheet" href="/src/app/shared/navbar/navbar.css">
  <link rel="stylesheet" href="/src/app/shared/button/button.css">
  <link rel="stylesheet" href="/src/app/shared/panel/panel.css">
  <link rel="stylesheet" href="/src/app/shared/toast/toast.css">
  <link rel="stylesheet" href="/src/app/features/courses/cursos.css">
  <link rel="stylesheet" href="/src/app/features/courses/gestionar-cursos.css">
</head>

<body class="courses">
  <nav class="navbar navbar--scrolled" id="adminNavbar" hidden>
    <a href="/index.html" class="navbar__brand">
      <img src="/src/assets/images/logo-horizontal.png" alt="Taudux logo" class="navbar__logo">
    </a>
    <div class="navbar__links navbar__links--visible navbar__links--simple">
      <a href="#" id="accessBtn" class="navbar__link button button--access">Salir</a>
    </div>
  </nav>

  <main class="courses__main">
    <div class="courses__container">
      <section class="courses__startup-status panel panel--spacious" id="adminStartup" role="status" aria-live="polite" aria-busy="true" tabindex="-1">
        <div class="courses__startup-loader" id="adminStartupLoader" aria-hidden="true"></div>
        <p class="courses__startup-announcement" id="adminStartupLoadingMessage">Cargando la administración de cursos.</p>
        <div class="courses__startup-error" id="adminStartupError" hidden>
          <h1 class="courses__subtitle" id="adminStartupTitle">No se pudo abrir la administración</h1>
          <p class="courses__startup-message" id="adminStartupMessage"></p>
          <div class="courses__startup-actions">
            <button class="button button--outline" type="button" id="adminStartupRetry" hidden>Reintentar</button>
            <a class="button button--outline" href="/src/app/features/courses/cursos.html">Volver al catálogo</a>
          </div>
        </div>
      </section>
      <noscript>
        <p class="courses__noscript panel">Necesitas habilitar JavaScript para administrar cursos. Puedes volver al <a href="/src/app/features/courses/cursos.html">catálogo de cursos</a>.</p>
      </noscript>

      <div class="courses__admin-content" id="adminContent" hidden>
        <header class="courses__header">
          <h1 class="courses__title">Gestionar cursos</h1>
          <p class="courses__intro">Edita o elimina los cursos que verán los usuarios.</p>
          <div class="courses__header-actions">
            <a class="button button--glow" href="/src/app/features/courses/gestionar-curso.html">Nuevo curso</a>
          </div>
        </header>

        <section class="courses__data-status" id="cursosEstado" role="alert" tabindex="-1" hidden>
          <p class="courses__data-status-message" id="cursosEstadoMensaje"></p>
          <button class="button button--outline" type="button" id="cursosReintentar">Reintentar carga</button>
        </section>
        <section class="courses__list" id="cursosLista" aria-label="Cursos publicados" aria-busy="true" tabindex="-1"></section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/src/app/core/supabase/supabase-client.js"></script>
  <script src="/src/app/core/auth/auth.service.js"></script>
  <script src="/src/app/core/cursos/cursos.service.js"></script>
  <script src="/src/app/shared/navbar/navbar.js"></script>
  <script src="/src/app/shared/toast/toast.js"></script>
  <script src="/src/app/features/courses/gestionar-cursos.js"></script>
</body>

</html>
