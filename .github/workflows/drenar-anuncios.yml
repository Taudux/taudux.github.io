# Disparo MANUAL del drenado de la cola de anuncios de curso nuevo. Sirve para
# forzar un envío o para verificar un despliegue del edge function sin esperar
# al próximo ciclo automático.
#
# El drenado automático vive por completo en pg_cron dentro de Supabase
# (migración 0019_drenar_anuncios_pg_cron.sql), cada 5 minutos. Este workflow
# ya NO tiene `schedule`: es una herramienta manual, no un respaldo automático.
#
# Por qué se sacó el cron programado (2026-08-06). GitHub Actions demostró dos
# modos de falla distintos en este mismo workflow:
#
#   1. Corridas salteadas: los cron programados en runners compartidos son
#      best-effort y en la práctica se saltearon ~7 de cada 8 corridas.
#   2. Runner no asignado: "The job was not acquired by Runner of type hosted
#      even after multiple attempts", tras ~15 minutos de reintentos.
#
# Contra eso, pg_cron corre dentro de la base y se verificó con 20 corridas
# consecutivas exitosas, exactamente cada 5 minutos, cada una en milisegundos.
# El respaldo horario llegaba 12 veces más tarde que pg_cron y era el único
# componente que fallaba.
#
# El costo real no era la corrida perdida — pg_cron ya cubría el envío — sino
# que cada falla de infraestructura de GitHub se ve idéntica a una caída de
# producción, y cuesta un diagnóstico completo descartarla.
#
# Nota: al no haber `schedule`, ya no aplica la desactivación automática que
# GitHub hace de los workflows programados en repos sin actividad por 60 días.
name: Drenar anuncios (manual · el automático es pg_cron)

on:
  workflow_dispatch: {}

jobs:
  drenar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a notify-course-published
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANUNCIOS_CRON_SECRET: ${{ secrets.ANUNCIOS_CRON_SECRET }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/respuesta.json -w "%{http_code}" \
            -X POST "${SUPABASE_FUNCTIONS_URL}/notify-course-published" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-taudux-anuncios-secret: ${ANUNCIOS_CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $status"
          cat /tmp/respuesta.json
          echo
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
