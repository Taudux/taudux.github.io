<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/images/1.png">
  <title>Iniciar sesión | Taudux</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app/shared/navbar/navbar.css">
  <link rel="stylesheet" href="/app/shared/button/button.css">
  <link rel="stylesheet" href="/app/shared/panel/panel.css">
  <link rel="stylesheet" href="/app/shared/field/field.css">
  <link rel="stylesheet" href="/app/features/auth/auth.css">
  <!--
    Enlaces de auth (confirmación, recuperación, OAuth) que aterrizan acá por
    una allowlist de Redirect URLs desactualizada en Supabase se rutean con
    la misma lógica que la raíz del sitio: ver auth-callback-guard.js.
  -->
  <script src="/app/core/auth/auth-callback-guard.js"></script>
  <script defer src="/app/core/analytics/ga4.js"></script>
</head>

<body>
  <nav class="navbar navbar--scrolled" aria-label="Navegación principal">
    <a href="/" class="navbar__brand">
      <img src="/assets/images/logo-horizontal2.png" alt="Taudux" class="navbar__logo">
    </a>
  </nav>

  <main class="auth">
    <section class="auth__card panel panel--spacious" aria-labelledby="authTitle">
      <h1 class="auth__title" id="authTitle">Iniciar sesión</h1>
      <p class="auth__subtitle">Accede a tu cuenta para continuar.</p>
      <div class="auth__status" id="authStatus" tabindex="-1" hidden></div>

      <button type="button" class="auth__oauth button" id="googleButton">
        <svg class="auth__oauth-icon" aria-hidden="true" focusable="false" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62Z" />
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z" />
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33Z" />
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z" />
        </svg>
        <span>Continuar con Google</span>
      </button>

      <div class="auth__separator" role="separator" aria-orientation="horizontal">
        <span class="auth__separator-texto">o</span>
      </div>

      <form class="auth__form" id="loginForm" novalidate>
        <div class="auth__field-group">
          <label class="auth__label" for="loginEmail">Correo electrónico</label>
          <input type="email" id="loginEmail" class="field" autocomplete="email" required>
        </div>

        <div class="auth__field-group">
          <label class="auth__label" for="loginPassword">Contraseña</label>
          <div class="password-field">
            <input type="password" id="loginPassword" class="password-field__input field" autocomplete="current-password" required>
            <button type="button" class="password-field__toggle" data-target="loginPassword" aria-label="Mostrar contraseña" aria-pressed="false">
              <svg class="password-field__icon password-field__icon--show" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg class="password-field__icon password-field__icon--hide" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19M1 1l22 22"></path><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"></path></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="auth__submit button button--glow" data-loading-text="Accediendo…">Iniciar sesión</button>
      </form>

      <div class="auth__actions">
        <button type="button" class="auth__link-button" id="reenviarButton" hidden>Reenviar correo de confirmación</button>
        <a class="auth__link" href="/app/features/auth/forgot-password/">¿Olvidaste tu contraseña?</a>
        <p>¿Aún no tienes una cuenta? <a class="auth__link" data-preserve-next href="/app/features/auth/signup/">Crear cuenta</a></p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app/core/supabase/supabase-client.js"></script>
  <script src="/app/core/auth/auth.service.js"></script>
  <script src="/app/features/auth/auth-ui.js"></script>
  <script src="/app/features/auth/login/login.js"></script>
</body>

</html>
