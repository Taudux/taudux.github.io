# Respaldo del drenado de la cola de anuncios de curso nuevo. El disparo
# principal ahora vive en pg_cron dentro de Supabase (migración
# 0019_drenar_anuncios_pg_cron.sql), cada 5 minutos: no depende de un runner
# compartido de GitHub. Este workflow existe por si pg_cron falla — de ahí la
# cadencia horaria en vez de cada 15 minutos — y como disparo manual desde la
# pestaña Actions cuando haga falta forzar un envío.
#
# Motivo del cambio: los cron programados de GitHub en runners compartidos son
# best-effort y en la práctica se saltearon ~7 de cada 8 corridas, dejando el
# aviso llegar en ~2 horas en vez de los 10-25 minutos de diseño. Dos
# schedulers concurrentes no duplican envíos: claim_curso_anuncio usa
# `for update skip locked` con fencing por claim_token/claim_generation.
#
# GitHub deshabilita los workflows programados de un repo sin actividad
# durante 60 días. Si este cron deja de correr, reactivalo con un clic desde
# la pestaña Actions.
name: Drenar anuncios de curso nuevo

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  drenar:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a notify-course-published
        env:
          SUPABASE_FUNCTIONS_URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANUNCIOS_CRON_SECRET: ${{ secrets.ANUNCIOS_CRON_SECRET }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/respuesta.json -w "%{http_code}" \
            -X POST "${SUPABASE_FUNCTIONS_URL}/notify-course-published" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "x-taudux-anuncios-secret: ${ANUNCIOS_CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP $status"
          cat /tmp/respuesta.json
          echo
          if [ "$status" -ge 400 ]; then
            exit 1
          fi
