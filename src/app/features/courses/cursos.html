<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/images/1.png">
  <title>Cursos | Taudux</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/app/shared/floating-menu/floating-menu.css">
  <link rel="stylesheet" href="/app/shared/navbar/navbar.css">
  <link rel="stylesheet" href="/app/shared/button/button.css">
  <link rel="stylesheet" href="/app/shared/panel/panel.css">
  <link rel="stylesheet" href="/app/shared/toast/toast.css">
  <link rel="stylesheet" href="/app/features/courses/cursos.css">
  <script defer src="/app/core/analytics/ga4.js"></script>
</head>

<body class="courses courses--catalog">
  <nav class="navbar navbar--scrolled" aria-label="Navegación principal">
    <a href="/" class="navbar__brand">
      <img src="/assets/images/logo-horizontal2.png" alt="Taudux logo" class="navbar__logo">
    </a>
    <div class="navbar__links navbar__links--visible navbar__links--simple">
      <a href="#" id="accessBtn" class="navbar__link button button--access">Acceder</a>
    </div>
  </nav>

  <main class="courses__main">
    <div class="courses__container u-contenedor u-contenedor--medio">
      <header class="courses__header">
        <p class="courses__eyebrow">Taudux Academy / Catálogo</p>
        <h1 class="courses__title">Cursos disponibles</h1>
        <p class="courses__intro">
          Formación en programación, análisis de datos e inteligencia artificial.
          Elige un curso y empieza a aprender con Taudux.
        </p>
        <div class="courses__header-actions" id="adminControls" hidden>
          <a class="button button--glow button--highlight" href="/app/features/courses/administrar-cursos.html">Administrar cursos</a>
          <a class="button button--outline" href="/app/features/courses/gestionar-categorias.html">Administrar categorías</a>
        </div>
      </header>

      <section class="courses__data-status" id="cursosEstado" role="alert" aria-live="assertive" tabindex="-1" hidden>
        <p class="courses__data-status-message" id="cursosEstadoMensaje"></p>
        <button class="button button--outline" type="button" id="cursosReintentar">Reintentar carga</button>
      </section>
      <section class="courses__list" id="cursosLista" aria-label="Cursos publicados" aria-live="polite" aria-busy="true" tabindex="-1"></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app/core/supabase/supabase-client.js"></script>
  <script src="/app/core/auth/auth.service.js"></script>
  <script src="/app/core/telemetry/operaciones.js"></script>
  <script src="/app/core/cursos/portadas.constantes.js"></script>
  <script src="/app/core/cursos/cursos.service.js"></script>
  <script src="/app/shared/navbar/navbar.js"></script>
  <script src="/app/shared/toast/toast.js"></script>
  <script src="/app/features/courses/curso-presentacion.js"></script>
  <script src="/app/features/courses/cursos.js"></script>
</body>

</html>
